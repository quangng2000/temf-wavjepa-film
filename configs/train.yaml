# @package _global_
# Groups and override order follow the Lightning-Hydra template.
defaults:
  - _self_
  - data: paired
  - model: temf
  - callbacks: default
  - logger: csv
  - trainer: default
  - paths: default
  - extras: default
  - hydra: default
  - experiment: null
  - hparams_search: null
  - optional local: default
  - debug: null

task_name: train
tags: [dev]
train: true
optimized_metric: null
# Empty group selection (logger=[]) keeps this null fallback.
logger: null
ckpt_path: null
seed: 42
cpu_threads: 4
total_updates: 300000
fixture: false
# Retained for existing CLI overrides and programmatic fixture tests.
output_dir: ${hydra:runtime.output_dir}
