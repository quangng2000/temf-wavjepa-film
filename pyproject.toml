[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "temf-wavjepa-film"
version = "0.4.0"
description = "Lightning/Hydra research scaffold for TEMF speech restoration"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.8.0", "lightning==2.5.5", "hydra-core==1.3.2",
  "torchmetrics==1.9.0", "pystoi==0.4.1", "certifi>=2024.2.2",
  "transformers==4.53.2", "einops==0.8.1", "soundfile==0.13.1",
  "torchdata==0.11.0", "rootutils==1.0.7",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.1", "pre-commit==4.7.0"]
augment = [
  "audiomentations==0.43.1", "pyroomacoustics==0.10.0",
  "fast-mp3-augment==0.2.0", "scipy>=1.10,<2",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.vendor.sgmse" = ["LICENSE*", "PROVENANCE.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 99
target-version = "py311"
extend-exclude = ["src/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I"]
