[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "temf-wavjepa-film"
version = "0.1.0"
description = "Lightning/Hydra research scaffold for TEMF speech restoration"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.8.0", "lightning==2.5.5", "hydra-core==1.3.2",
  "transformers==4.53.2", "einops==0.8.1", "soundfile==0.13.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.1"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
